version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: scheduling_service
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduling_service"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scheduling-network

  # Redis for Bull Queue
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - scheduling-network

  # Scheduling Service
  scheduling-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://scheduler:scheduler_password@postgres:5432/scheduling_service?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_password
      REDIS_DB: 0
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
      JWT_EXPIRES_IN: "1d"
      LOG_LEVEL: info
      LOG_FORMAT: json
      METRICS_ENABLED: "true"
      HEALTH_CHECK_TIMEOUT: 5000
      SCHEDULER_TIMEZONE: "UTC"
      SCHEDULER_MAX_CONCURRENT_JOBS: 10
      QUEUE_CONCURRENCY: 10
      # Service Discovery (pour future intégration)
      MESSAGING_SERVICE_URL: "messaging-service:50051"
      NOTIFICATION_SERVICE_URL: "notification-service:50051"
      MEDIA_SERVICE_URL: "media-service:50051"
      USER_SERVICE_URL: "user-service:50051"
      AUTH_SERVICE_URL: "auth-service:50051"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - scheduling-network
    volumes:
      - /app/node_modules
    
  # Bull Dashboard (optional, for development)
  bull-dashboard:
    image: node:18-alpine
    command: >
      sh -c "
        npm install -g bull-dashboard &&
        bull-dashboard --redis-host redis --redis-port 6379 --redis-password redis_password --port 4000
      "
    ports:
      - "4000:4000"
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_password
    networks:
      - scheduling-network
    profiles:
      - dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  scheduling-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16