version: '3.9'

services:
  # PostgreSQL Database for Scheduling Service
  postgres:
    image: postgres:15-alpine
    container_name: whispr-scheduling-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: scheduling_service
      POSTGRES_PASSWORD: development_password
      POSTGRES_DB: whispr_scheduling_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduling_service -d whispr_scheduling_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scheduling-network

  # Redis for Scheduling Service (Bull Queue)
  redis:
    image: redis:7-alpine
    container_name: whispr-scheduling-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - scheduling-network

  # Scheduling Service (NestJS/TypeScript)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whispr-scheduling
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://scheduling_service:development_password@postgres:5432/whispr_scheduling_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      PORT: 3000
      GRPC_PORT: 3001
      GRPC_HOST: 0.0.0.0
      NODE_ENV: development
      BULL_BOARD_ENABLED: true
      BULL_BOARD_USERNAME: admin
      BULL_BOARD_PASSWORD: admin123
      MESSAGING_SERVICE_HOST: host.docker.internal
      MESSAGING_SERVICE_PORT: 4001
      NOTIFICATION_SERVICE_HOST: host.docker.internal
      NOTIFICATION_SERVICE_PORT: 4002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - scheduling-network
    profiles:
      - full

volumes:
  postgres_data:
    driver: local
    name: whispr-scheduling-postgres-data
  redis_data:
    driver: local
    name: whispr-scheduling-redis-data

networks:
  scheduling-network:
    driver: bridge
    name: whispr-scheduling-network
