syntax = "proto3";

package whispr.messaging;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

service MessagingService {
  // Send notification when a scheduled job executes
  rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse);

  // Send scheduled message
  rpc SendScheduledMessage(SendScheduledMessageRequest) returns (SendMessageResponse);

  // Cleanup expired messages
  rpc CleanupExpiredMessages(CleanupRequest) returns (CleanupResponse);

  // Health check
  rpc HealthCheck(google.protobuf.Empty) returns (HealthResponse);
}

// Enums
enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  TEXT = 1;
  IMAGE = 2;
  VIDEO = 3;
  AUDIO = 4;
  FILE = 5;
  SYSTEM = 6;
}

enum NotificationType {
  NOTIFICATION_TYPE_UNSPECIFIED = 0;
  MESSAGE = 1;
  REMINDER = 2;
  SYSTEM_ALERT = 3;
  SCHEDULED_MESSAGE = 4;
}

// Requests
message SendNotificationRequest {
  string user_id = 1;
  string message = 2;
  string conversation_id = 3;
  NotificationType type = 4;
  map<string, string> metadata = 5;
  google.protobuf.Timestamp scheduled_for = 6;
}

message SendScheduledMessageRequest {
  string conversation_id = 1;
  string sender_id = 2;
  MessageType message_type = 3;
  string content = 4;
  map<string, string> metadata = 5;
  google.protobuf.Timestamp scheduled_for = 6;
}

message CleanupRequest {
  google.protobuf.Timestamp older_than = 1;
  int32 batch_size = 2;
}

// Responses
message SendNotificationResponse {
  string notification_id = 1;
  string status = 2;
  google.protobuf.Timestamp sent_at = 3;
  string error_message = 4;
}

message SendMessageResponse {
  string message_id = 1;
  string status = 2;
  google.protobuf.Timestamp sent_at = 3;
}

message CleanupResponse {
  int32 deleted_count = 1;
  google.protobuf.Timestamp processed_at = 2;
}

message HealthResponse {
  string status = 1;
  string message = 2;
  google.protobuf.Timestamp timestamp = 3;
}
