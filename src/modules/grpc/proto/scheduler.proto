syntax = "proto3";

package whispr.scheduler;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

service SchedulerService {
  // Job Management
  rpc CreateJob(CreateJobRequest) returns (JobResponse);
  rpc GetJob(GetJobRequest) returns (JobResponse);
  rpc ScheduleJob(ScheduleJobRequest) returns (ScheduleResponse);
  rpc ExecuteJob(ExecuteJobRequest) returns (ExecutionResponse);
  rpc CancelSchedule(CancelScheduleRequest) returns (google.protobuf.Empty);

  // Health and Status
  rpc HealthCheck(google.protobuf.Empty) returns (HealthResponse);
  rpc GetMetrics(google.protobuf.Empty) returns (MetricsResponse);
}

// Enums
enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  LOW = 1;
  MEDIUM = 2;
  HIGH = 3;
  CRITICAL = 4;
}

enum ScheduleType {
  SCHEDULE_TYPE_UNSPECIFIED = 0;
  CRON = 1;
  INTERVAL = 2;
  ONCE = 3;
  IMMEDIATE = 4;
}

enum ExecutionStatus {
  EXECUTION_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  RUNNING = 2;
  COMPLETED = 3;
  FAILED = 4;
  CANCELLED = 5;
  TIMEOUT = 6;
}

// Requests
message CreateJobRequest {
  string name = 1;
  string description = 2;
  string category_id = 3;
  string target_service = 4;
  string target_method = 5;
  string payload = 6; // JSON string
  Priority priority = 7;
  int32 max_retries = 8;
  int32 timeout_seconds = 9;
  string created_by = 10;
}

message GetJobRequest {
  string job_id = 1;
}

message ScheduleJobRequest {
  string job_id = 1;
  ScheduleType schedule_type = 2;
  string cron_expression = 3;
  int32 interval_seconds = 4;
  google.protobuf.Timestamp scheduled_at = 5;
  string timezone = 6;
  google.protobuf.Timestamp starts_at = 7;
  google.protobuf.Timestamp ends_at = 8;
}

message ExecuteJobRequest {
  string job_id = 1;
  string schedule_id = 2;
  string correlation_id = 3;
}

message CancelScheduleRequest {
  string schedule_id = 1;
}

// Responses
message JobResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  string category_id = 4;
  string target_service = 5;
  string target_method = 6;
  string payload = 7; // JSON string
  Priority priority = 8;
  int32 max_retries = 9;
  int32 timeout_seconds = 10;
  bool is_active = 11;
  string created_by = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

message ScheduleResponse {
  string id = 1;
  string job_id = 2;
  ScheduleType schedule_type = 3;
  string cron_expression = 4;
  int32 interval_seconds = 5;
  google.protobuf.Timestamp scheduled_at = 6;
  string timezone = 7;
  google.protobuf.Timestamp starts_at = 8;
  google.protobuf.Timestamp ends_at = 9;
  bool is_active = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message ExecutionResponse {
  string id = 1;
  string job_id = 2;
  string schedule_id = 3;
  ExecutionStatus status = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp completed_at = 6;
  google.protobuf.Timestamp failed_at = 7;
  int32 attempt_number = 8;
  string result_data = 9; // JSON string
  string error_data = 10; // JSON string
  int32 duration_ms = 11;
  string worker_id = 12;
  string correlation_id = 13;
  google.protobuf.Timestamp created_at = 14;
}

message HealthResponse {
  string status = 1;
  string message = 2;
  google.protobuf.Timestamp timestamp = 3;
  map<string, string> details = 4;
}

message MetricsResponse {
  google.protobuf.Timestamp timestamp = 1;
  JobMetrics jobs = 2;
  ExecutionMetrics executions = 3;
  QueueMetrics queues = 4;
  SystemMetrics system = 5;
}

message JobMetrics {
  int32 total = 1;
  int32 active = 2;
  int32 completed_24h = 3;
  int32 failed_24h = 4;
  int32 pending = 5;
}

message ExecutionMetrics {
  int32 total = 1;
  int32 successful_24h = 2;
  int32 failed_24h = 3;
  double average_duration = 4;
  double success_rate = 5;
}

message QueueMetrics {
  QueueStats high_priority = 1;
  QueueStats medium_priority = 2;
  QueueStats low_priority = 3;
}

message QueueStats {
  string name = 1;
  int32 waiting = 2;
  int32 active = 3;
  int32 completed = 4;
  int32 failed = 5;
  int32 delayed = 6;
  int32 paused = 7;
}

message SystemMetrics {
  int32 uptime = 1;
  int32 memory_usage = 2;
  double cpu_usage = 3;
}