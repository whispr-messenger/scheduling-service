version: '3.8'

services:
  # PostgreSQL Database
  postgres-dev:
    image: postgres:15-alpine
    container_name: whispr-scheduling-db
    environment:
      POSTGRES_DB: whispr_media_dev
      POSTGRES_USER: whisper_user
      POSTGRES_PASSWORD: whisper_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whisper_user -d whispr_media_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - whispr-network

  # Redis for Bull Queue
  redis-dev:
    image: redis:7-alpine
    container_name: whispr-scheduling-redis
    command: redis-server --appendonly yes --requirepass redis_password
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whispr-network

  # Scheduling Service
  scheduling-service:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.dev
    container_name: whispr-scheduling-service
    environment:
      NODE_ENV: development
      PORT: 3001
      GRPC_PORT: 50051
      DATABASE_URL: postgresql://scheduling_service:development_password@postgres:5432/whispr_scheduling
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: scheduling_service
      DB_PASSWORD: development_password
      DB_NAME: whispr_scheduling
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: development_password
      REDIS_DB: 0
      DEFAULT_TIMEZONE: UTC
      MAX_CONCURRENT_JOBS: 100
      ENABLE_METRICS: true
      ENABLE_AUDIT_LOGS: true
      CORS_ENABLED: true
      SWAGGER_ENABLED: true
    ports:
      - "3001:3001"
      - "50051:50051"
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    volumes:
      # Mount repository root into container so source files are available for development
      - ..:/app
      # Keep node_modules inside the container to avoid host/permission issues
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/monitoring/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - whispr-network
    restart: unless-stopped

  # Redis Commander (optional GUI for Redis)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: whispr-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379:0:development_password
    ports:
      - "8081:8081"
    depends_on:
      - redis-dev
    networks:
      - whispr-network
    profiles:
      - tools

  # pgAdmin (optional GUI for PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: whispr-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@whispr.dev
      PGADMIN_DEFAULT_PASSWORD: development_password
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    depends_on:
      - postgres-dev
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - whispr-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  whispr-network:
    driver: bridge
    name: whispr-network