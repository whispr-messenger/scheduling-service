services:
  # PostgreSQL Database
  postgres-dev:
    image: postgres:15-alpine
    container_name: whispr-scheduling-db
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-whispr_scheduling_dev}
      POSTGRES_USER: ${DATABASE_USERNAME:-whisper_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-whisper_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-whisper_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - whispr-network

  # Redis for Bull Queue
  redis-dev:
    image: redis:7-alpine
    container_name: whispr-scheduling-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whispr-network

  # Scheduling Service
  scheduling-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: whispr-scheduling-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      GRPC_PORT: 50051
      DATABASE_HOST: ${DATABASE_HOST:-postgres-dev}
      DATABASE_PORT: ${DATABASE_INTERNAL_PORT:-5432}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-whisper_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-whisper_password}
      DATABASE_NAME: ${DATABASE_NAME:-whispr_scheduling_dev}
      DATABASE_SSL: false
      REDIS_HOST: ${REDIS_HOST:-redis-dev}
      REDIS_PORT: ${REDIS_INTERNAL_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      REDIS_DB: 0
      DEFAULT_TIMEZONE: UTC
      MAX_CONCURRENT_JOBS: 100
      ENABLE_METRICS: true
      ENABLE_AUDIT_LOGS: true
      CORS_ENABLED: true
      SWAGGER_ENABLED: true
    ports:
      - "3001:3001"
      - "50051:50051"
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    volumes:
      # Mount repository root into container so source files are available for development
      - .:/app
      # Keep node_modules inside the container to avoid host/permission issues
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/monitoring/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - whispr-network
    restart: unless-stopped

  # Redis Commander (optional GUI for Redis)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: whispr-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379:0:development_password
    ports:
      - "8081:8081"
    depends_on:
      - redis-dev
    networks:
      - whispr-network
    profiles:
      - tools

  # pgAdmin (optional GUI for PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: whispr-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@whispr.dev
      PGADMIN_DEFAULT_PASSWORD: development_password
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    depends_on:
      - postgres-dev
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - whispr-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  whispr-network:
    driver: bridge
    name: whispr-network