name: 🏷️ Auto-Labeller

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  auto-label:
    name: 🏷️ Label Pull Request
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 🏷️ Apply Labels
        uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
          sync-labels: true

  priority-labeler:
    name: 🎯 Priority & Impact Assessment
    runs-on: ubuntu-latest
    # Skip forks entirely: pull_request_target runs with secrets on the base repo,
    # so we must never check out fork-controlled refs.
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.fork == false
      }}
    needs: auto-label
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Always checkout the base branch SHA (trusted), not the PR head.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: 🔍 Analyze PR Impact
        id: analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAGER: ""
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Get changed files
          echo "Analyzing changed files..."

          # Critical files that require high priority - Scheduling Service Specific
          CRITICAL_FILES="src/main.ts src/app.module.ts src/modules/scheduler/scheduler.module.ts src/modules/scheduler/scheduler.service.ts src/modules/queues/queue.service.ts src/config/database.config.ts docker/Dockerfile docker-compose.yml .github/workflows/"

          # Security-related files
          SECURITY_FILES="src/common/guards/ src/common/filters/"

          # Scheduler core files
          SCHEDULER_FILES="src/modules/scheduler/ src/scheduler/"

          # Queue management files
          QUEUE_FILES="src/modules/queues/ src/queues/ src/modules/queues/processors/"

          # Get PR files
          gh pr view "$PR_NUMBER" --json files --jq '.files[].path' > changed_files.txt

          # Initialize flags
          CRITICAL_CHANGED=false
          SECURITY_CHANGED=false
          DATABASE_CHANGED=false
          TESTS_CHANGED=false
          DOCS_CHANGED=false
          SCHEDULER_CHANGED=false
          QUEUE_CHANGED=false
          GRPC_CHANGED=false
          CACHE_CHANGED=false
          MONITORING_CHANGED=false
          ISTIO_CHANGED=false

          # Check each changed file
          while IFS= read -r file; do
            echo "Checking file: $file"

            # Check critical files
            for pattern in $CRITICAL_FILES; do
              if [[ "$file" == *"$pattern"* ]]; then
                echo "critical=true" >> "$GITHUB_OUTPUT"
                CRITICAL_CHANGED=true
                break
              fi
            done

            # Check security files
            for pattern in $SECURITY_FILES; do
              if [[ "$file" == *"$pattern"* ]]; then
                echo "security=true" >> "$GITHUB_OUTPUT"
                SECURITY_CHANGED=true
                break
              fi
            done

            # Check scheduler files
            if [[ "$file" == *"scheduler"* ]] || [[ "$file" == *"cron"* ]]; then
              echo "scheduler=true" >> "$GITHUB_OUTPUT"
              SCHEDULER_CHANGED=true
            fi

            # Check queue files
            if [[ "$file" == *"queue"* ]] || [[ "$file" == *"bull"* ]] || [[ "$file" == *"processor"* ]]; then
              echo "queue=true" >> "$GITHUB_OUTPUT"
              QUEUE_CHANGED=true
            fi

            # Check gRPC
            if [[ "$file" == *"grpc"* ]] || [[ "$file" == *".proto"* ]]; then
              echo "grpc=true" >> "$GITHUB_OUTPUT"
              GRPC_CHANGED=true
            fi

            # Check monitoring
            if [[ "$file" == *"monitoring"* ]] || [[ "$file" == *"health"* ]] || [[ "$file" == *"metrics"* ]]; then
              echo "monitoring=true" >> "$GITHUB_OUTPUT"
              MONITORING_CHANGED=true
            fi

            # Check cache/Redis
            if [[ "$file" == *"cache"* ]] || [[ "$file" == *"redis"* ]]; then
              echo "cache=true" >> "$GITHUB_OUTPUT"
              CACHE_CHANGED=true
            fi

            # Check Istio/Service Mesh
            if [[ "$file" == *"istio"* ]] || [[ "$file" == *"mtls"* ]] || [[ "$file" == *"virtualservice"* ]]; then
              echo "istio=true" >> "$GITHUB_OUTPUT"
              ISTIO_CHANGED=true
            fi

            # Check database changes
            if [[ "$file" == *"migration"* ]] || [[ "$file" == *"entities"* ]] || [[ "$file" == *"entity.ts"* ]] || [[ "$file" == *"database.config"* ]]; then
              echo "database=true" >> "$GITHUB_OUTPUT"
              DATABASE_CHANGED=true
            fi

            # Check test files
            if [[ "$file" == *".spec.ts"* ]] || [[ "$file" == *".test.ts"* ]] || [[ "$file" == *"test/"* ]] || [[ "$file" == *".e2e-spec.ts"* ]]; then
              echo "tests=true" >> "$GITHUB_OUTPUT"
              TESTS_CHANGED=true
            fi

            # Check documentation
            if [[ "$file" == *".md"* ]] || [[ "$file" == *"documentation/"* ]] || [[ "$file" == *"docs/"* ]]; then
              echo "docs=true" >> "$GITHUB_OUTPUT"
              DOCS_CHANGED=true
            fi

          done < changed_files.txt

          # Calculate PR size
          CHANGED_LINES=$(gh pr view "$PR_NUMBER" --json additions,deletions --jq '.additions + .deletions')
          echo "changed_lines=$CHANGED_LINES" >> "$GITHUB_OUTPUT"

          if (( CHANGED_LINES > 500 )); then
            echo "size=XL" >> "$GITHUB_OUTPUT"
          elif (( CHANGED_LINES > 200 )); then
            echo "size=L" >> "$GITHUB_OUTPUT"
          elif (( CHANGED_LINES > 50 )); then
            echo "size=M" >> "$GITHUB_OUTPUT"
          elif (( CHANGED_LINES > 10 )); then
            echo "size=S" >> "$GITHUB_OUTPUT"
          else
            echo "size=XS" >> "$GITHUB_OUTPUT"
          fi

      - name: 🎯 Apply Priority Labels
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const labels = [];

            // Priority labels based on impact
            if ('${{ steps.analyze.outputs.critical }}' === 'true') {
              labels.push('🔥 priority:critical');
            } else if ('${{ steps.analyze.outputs.security }}' === 'true' || '${{ steps.analyze.outputs.database }}' === 'true') {
              labels.push('⚠️ priority:high');
            } else if ('${{ steps.analyze.outputs.scheduler }}' === 'true' || '${{ steps.analyze.outputs.queue }}' === 'true') {
              labels.push('⚡ priority:medium');
            } else if ('${{ steps.analyze.outputs.docs }}' === 'true') {
              labels.push('🟢 priority:low');
            }

            // Size labels
            const size = '${{ steps.analyze.outputs.size }}';
            if (size) {
              labels.push(`📏 size:${size}`);
            }

            // Type-specific labels
            if ('${{ steps.analyze.outputs.tests }}' === 'true') {
              labels.push('tests');
            }

            if ('${{ steps.analyze.outputs.docs }}' === 'true') {
              labels.push('📚 type:documentation');
            }

            if ('${{ steps.analyze.outputs.security }}' === 'true') {
              labels.push('🔒 type:security');
            }

            if ('${{ steps.analyze.outputs.database }}' === 'true') {
              labels.push('🗄️ type:database');
            }

            // Scheduling service specific labels
            if ('${{ steps.analyze.outputs.scheduler }}' === 'true') {
              labels.push('⏰ scheduler');
            }

            if ('${{ steps.analyze.outputs.queue }}' === 'true') {
              labels.push('📋 queues:bull');
            }

            if ('${{ steps.analyze.outputs.grpc }}' === 'true') {
              labels.push('🔗 grpc');
            }

            if ('${{ steps.analyze.outputs.monitoring }}' === 'true') {
              labels.push('📊 monitoring');
            }

            if ('${{ steps.analyze.outputs.cache }}' === 'true') {
              labels.push('💾 cache:redis');
            }

            if ('${{ steps.analyze.outputs.istio }}' === 'true') {
              labels.push('🔐 istio:mtls');
            }

            // Apply labels if any were determined
            if (labels.length > 0) {
              console.log(`Applying labels: ${labels.join(', ')}`);
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels
              });
            } else {
              console.log('No additional labels to apply');
            }

      - name: 📝 Comment on PR
        if: steps.analyze.outputs.critical == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comment = `## ⚠️ Critical Changes Detected

            This PR modifies critical files in the scheduling service. Please ensure:

            - [ ] All tests pass (unit, integration, e2e)
            - [ ] No breaking changes to the gRPC API contract
            - [ ] Database migrations are backward compatible
            - [ ] Queue processors handle errors gracefully
            - [ ] Monitoring and health checks are updated if needed
            - [ ] Documentation is updated to reflect changes
            - [ ] Consider impact on running jobs and schedules

            **Critical Areas Changed:**
            - Main application files
            - Scheduler core logic
            - Queue processing
            - Database schema

            Please review carefully before merging.`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: comment
            });
