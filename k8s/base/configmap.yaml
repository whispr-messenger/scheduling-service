apiVersion: v1
kind: ConfigMap
metadata:
  name: scheduling-service-config
  labels:
    app: scheduling-service
    app.kubernetes.io/name: scheduling-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: whispr
data:
  REDIS_HOST: "scheduling-redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  MESSAGING_SERVICE_HOST: "messaging-service"
  MESSAGING_SERVICE_PORT: "4001"
  NOTIFICATION_SERVICE_HOST: "notification-service"
  NOTIFICATION_SERVICE_PORT: "4002"
  BULL_BOARD_ENABLED: "false"
  MAX_CONCURRENT_JOBS: "100"
  DEFAULT_TIMEZONE: "UTC"
